name: Feature request
description: Propose a focused improvement or workflow use case
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user and the current workflow. Avoid private ticket or customer details.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What should become easier?
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current workaround
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Workflow builder
        - Agent execution
        - Tracker integration
        - Git and pull requests
        - Dashboard and history
        - Installation and setup
        - Documentation
        - Other
    validations:
      required: true
